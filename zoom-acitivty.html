<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raster vs Vector Image Zoom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    header {
      text-align: center;
      padding: 24px 16px 12px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
      font-size: 15px;
    }

    .controls {
      width: min(900px, 94vw);
      margin: 18px auto;
      padding: 16px;
      background: #1f2937;
      border-radius: 14px;
      display: grid;
      gap: 12px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 120px 1fr 70px;
      align-items: center;
      gap: 12px;
    }

    label {
      font-weight: bold;
      color: #f3f4f6;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
      padding: 10px 14px;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    .comparison {
      width: min(1200px, 96vw);
      margin: 16px auto 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .panel {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .panel h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .panel p {
      margin: 0 0 12px;
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.45;
    }

    canvas, #vectorSvg {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-radius: 12px;
      border: 2px solid #4b5563;
      cursor: crosshair;
      overflow: hidden;
    }

    .note {
      width: min(900px, 94vw);
      margin: 0 auto 30px;
      color: #cbd5e1;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 800px) {
      .comparison {
        grid-template-columns: 1fr;
      }

      .control-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Raster vs Vector Zoom Activity</h1>
    <p>Compare how a <strong>raster (canvas)</strong> image pixelates vs a <strong>vector (SVG)</strong> image stays sharp when zoomed.</p>
  </header>

  <section class="controls">
    <div class="control-row">
      <label for="zoomRange">Zoom</label>
      <input id="zoomRange" type="range" min="1" max="8" step="0.1" value="1" />
      <span id="zoomValue">1.0x</span>
    </div>

    <button id="resetButton">Reset Activity</button>
  </section>

  <main class="comparison">
    <section class="panel">

      <canvas id="pixelCanvas" width="520" height="520"></canvas>
    </section>

    <section class="panel">

      <svg id="vectorSvg" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="50%" stop-color="#f472b6"/>
            <stop offset="100%" stop-color="#facc15"/>
          </linearGradient>
          <clipPath id="svgClip">
            <rect width="520" height="520"/>
          </clipPath>
        </defs>
        <g id="svgScene" clip-path="url(#svgClip)">
          <!-- background -->
          <rect width="520" height="520" fill="url(#bgGrad)"/>
          <!-- grid lines -->
          <g id="gridLines" stroke="rgba(255,255,255,0.22)" stroke-width="2"></g>
          <!-- face circle -->
          <circle cx="260" cy="260" r="130" fill="#111827"/>
          <!-- eyes white -->
          <circle cx="210" cy="225" r="28" fill="#f9fafb"/>
          <circle cx="310" cy="225" r="28" fill="#f9fafb"/>
          <!-- pupils -->
          <circle cx="220" cy="230" r="10" fill="#111827"/>
          <circle cx="300" cy="230" r="10" fill="#111827"/>
          <!-- smile -->
          <path d="M 201 275 A 60 60 0 0 0 319 275" stroke="#f9fafb" stroke-width="14" stroke-linecap="round" fill="none"/>
          <!-- title text -->
         
          <!-- sharp text -->
          <text x="260" y="445" text-anchor="middle" font-family="Arial" font-size="46" font-weight="bold" fill="#ffffff">SHARP IMAGE</text>
          <!-- crosshair -->
        </g>
        <g id="svgCrosshair">
          <line id="chH" stroke="rgba(17,24,39,0.8)" stroke-width="3"/>
          <line id="chV" stroke="rgba(17,24,39,0.8)" stroke-width="3"/>
          <line id="chH2" stroke="rgba(255,255,255,0.9)" stroke-width="1"/>
          <line id="chV2" stroke="rgba(255,255,255,0.9)" stroke-width="1"/>
        </g>
      </svg>
    </section>
  </main>

  <p class="note">
    Move your mouse over either panel to choose the zoom center. Increase the zoom slider — notice the left side pixelates while the right side stays crisp.
  </p>

  <script>
    const pixelCanvas = document.getElementById("pixelCanvas");
    const vectorSvg = document.getElementById("vectorSvg");
    const svgScene = document.getElementById("svgScene");

    const pixelCtx = pixelCanvas.getContext("2d");

    const zoomRange = document.getElementById("zoomRange");
    const zoomValue = document.getElementById("zoomValue");
    const resetButton = document.getElementById("resetButton");

    const size = 520;

    let zoom = 1;
    let focus = {
      x: size / 2,
      y: size / 2
    };

    const sourceCanvas = document.createElement("canvas");
    sourceCanvas.width = size;
    sourceCanvas.height = size;
    const sourceCtx = sourceCanvas.getContext("2d");

    function buildSvgGrid() {
      const g = document.getElementById("gridLines");
      for (let y = 0; y < size; y += 26) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", 0); line.setAttribute("y1", y);
        line.setAttribute("x2", size); line.setAttribute("y2", y);
        g.appendChild(line);
      }
      for (let x = 0; x < size; x += 26) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x); line.setAttribute("y1", 0);
        line.setAttribute("x2", x); line.setAttribute("y2", size);
        g.appendChild(line);
      }
    }

    function createSourceImage() {
      sourceCtx.clearRect(0, 0, size, size);

      const gradient = sourceCtx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, "#60a5fa");
      gradient.addColorStop(0.5, "#f472b6");
      gradient.addColorStop(1, "#facc15");

      sourceCtx.fillStyle = gradient;
      sourceCtx.fillRect(0, 0, size, size);

      sourceCtx.fillStyle = "rgba(255, 255, 255, 0.22)";
      for (let y = 0; y < size; y += 26) {
        sourceCtx.fillRect(0, y, size, 2);
      }

      for (let x = 0; x < size; x += 26) {
        sourceCtx.fillRect(x, 0, 2, size);
      }

      sourceCtx.fillStyle = "#111827";
      sourceCtx.beginPath();
      sourceCtx.arc(260, 260, 130, 0, Math.PI * 2);
      sourceCtx.fill();

      sourceCtx.fillStyle = "#f9fafb";
      sourceCtx.beginPath();
      sourceCtx.arc(210, 225, 28, 0, Math.PI * 2);
      sourceCtx.arc(310, 225, 28, 0, Math.PI * 2);
      sourceCtx.fill();

      sourceCtx.fillStyle = "#111827";
      sourceCtx.beginPath();
      sourceCtx.arc(220, 230, 10, 0, Math.PI * 2);
      sourceCtx.arc(300, 230, 10, 0, Math.PI * 2);
      sourceCtx.fill();

      sourceCtx.strokeStyle = "#f9fafb";
      sourceCtx.lineWidth = 14;
      sourceCtx.lineCap = "round";
      sourceCtx.beginPath();
      sourceCtx.arc(260, 275, 60, 0.15 * Math.PI, 0.85 * Math.PI);
      sourceCtx.stroke();

      sourceCtx.fillStyle = "#ffffff";
      sourceCtx.font = "bold 46px Arial";
      sourceCtx.textAlign = "center";
      sourceCtx.fillText("SHARP IMAGE", 260, 445);

      sourceCtx.fillStyle = "#111827";
      sourceCtx.font = "bold 24px Arial";
      sourceCtx.fillText("", 260, 72);
    }

    function getZoomSourceRectangle() {
      const sourceWidth = size / zoom;
      const sourceHeight = size / zoom;

      let sx = focus.x - sourceWidth / 2;
      let sy = focus.y - sourceHeight / 2;

      sx = Math.max(0, Math.min(size - sourceWidth, sx));
      sy = Math.max(0, Math.min(size - sourceHeight, sy));

      return {
        sx,
        sy,
        sw: sourceWidth,
        sh: sourceHeight
      };
    }

    function drawPixelatedZoom() {
      pixelCtx.clearRect(0, 0, size, size);

      const rect = getZoomSourceRectangle();

      pixelCtx.imageSmoothingEnabled = zoom <= 1;

      pixelCtx.drawImage(
        sourceCanvas,
        rect.sx,
        rect.sy,
        rect.sw,
        rect.sh,
        0,
        0,
        size,
        size
      );

      drawCrosshair(pixelCtx);
    }

    function drawSvgZoom() {
      const tx = -(focus.x * zoom - size / 2);
      const ty = -(focus.y * zoom - size / 2);
      const clamped = {
        x: Math.max(size - size * zoom, Math.min(0, tx)),
        y: Math.max(size - size * zoom, Math.min(0, ty))
      };
      svgScene.setAttribute("transform", `translate(${clamped.x},${clamped.y}) scale(${zoom})`);

      // crosshair stays in SVG viewport coords (unscaled)
      const cx = (focus.x * zoom + clamped.x);
      const cy = (focus.y * zoom + clamped.y);
      document.getElementById("chH").setAttribute("x1", cx - 15); document.getElementById("chH").setAttribute("y1", cy); document.getElementById("chH").setAttribute("x2", cx + 15); document.getElementById("chH").setAttribute("y2", cy);
      document.getElementById("chV").setAttribute("x1", cx); document.getElementById("chV").setAttribute("y1", cy - 15); document.getElementById("chV").setAttribute("x2", cx); document.getElementById("chV").setAttribute("y2", cy + 15);
      document.getElementById("chH2").setAttribute("x1", cx - 15); document.getElementById("chH2").setAttribute("y1", cy); document.getElementById("chH2").setAttribute("x2", cx + 15); document.getElementById("chH2").setAttribute("y2", cy);
      document.getElementById("chV2").setAttribute("x1", cx); document.getElementById("chV2").setAttribute("y1", cy - 15); document.getElementById("chV2").setAttribute("x2", cx); document.getElementById("chV2").setAttribute("y2", cy + 15);

    }

    function drawCrosshair(ctx) {
      ctx.save();

      ctx.strokeStyle = "rgba(17, 24, 39, 0.8)";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(focus.x - 15, focus.y);
      ctx.lineTo(focus.x + 15, focus.y);
      ctx.moveTo(focus.x, focus.y - 15);
      ctx.lineTo(focus.x, focus.y + 15);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(focus.x - 15, focus.y);
      ctx.lineTo(focus.x + 15, focus.y);
      ctx.moveTo(focus.x, focus.y - 15);
      ctx.lineTo(focus.x, focus.y + 15);
      ctx.stroke();

      ctx.restore();
    }

    function render() {
      zoom = Number(zoomRange.value);
      zoomValue.textContent = zoom.toFixed(1) + "x";
      drawPixelatedZoom();
      drawSvgZoom();
    }

    function updateFocusFromPointer(event) {
      const rect = event.currentTarget.getBoundingClientRect();
      const scaleX = size / rect.width;
      const scaleY = size / rect.height;
      focus.x = Math.max(0, Math.min(size, (event.clientX - rect.left) * scaleX));
      focus.y = Math.max(0, Math.min(size, (event.clientY - rect.top) * scaleY));
      render();
    }

    pixelCanvas.addEventListener("mousemove", updateFocusFromPointer);
    vectorSvg.addEventListener("mousemove", updateFocusFromPointer);

    pixelCanvas.addEventListener("touchmove", function(event) {
      event.preventDefault();
      updateFocusFromPointer(event.touches[0]);
    }, { passive: false });

    vectorSvg.addEventListener("touchmove", function(event) {
      event.preventDefault();
      updateFocusFromPointer(event.touches[0]);
    }, { passive: false });

    zoomRange.addEventListener("input", render);

    resetButton.addEventListener("click", function() {
      zoomRange.value = 1;
      focus = { x: size / 2, y: size / 2 };
      render();
    });

    buildSvgGrid();
    createSourceImage();
    render();
  </script>
</body>
</html>
