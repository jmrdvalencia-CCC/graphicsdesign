<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixelated vs Coordinate Rearranged Image Zoom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    header {
      text-align: center;
      padding: 24px 16px 12px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
      font-size: 15px;
    }

    .controls {
      width: min(900px, 94vw);
      margin: 18px auto;
      padding: 16px;
      background: #1f2937;
      border-radius: 14px;
      display: grid;
      gap: 12px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 120px 1fr 70px;
      align-items: center;
      gap: 12px;
    }

    label {
      font-weight: bold;
      color: #f3f4f6;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
      padding: 10px 14px;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    .comparison {
      width: min(1200px, 96vw);
      margin: 16px auto 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .panel {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .panel h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .panel p {
      margin: 0 0 12px;
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.45;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-radius: 12px;
      border: 2px solid #4b5563;
      cursor: crosshair;
    }

    .note {
      width: min(900px, 94vw);
      margin: 0 auto 30px;
      color: #cbd5e1;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 800px) {
      .comparison {
        grid-template-columns: 1fr;
      }

      .control-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Image Zoom Comparison Activity</h1>
    <p>Compare how an image behaves when zoomed using two different rendering methods.</p>
  </header>

  <section class="controls">
    <div class="control-row">
      <label for="zoomRange">Zoom</label>
      <input id="zoomRange" type="range" min="1" max="8" step="0.1" value="1" />
      <span id="zoomValue">1.0x</span>
    </div>

    <div class="control-row">
      <label for="tileRange">Tile Size</label>
      <input id="tileRange" type="range" min="20" max="100" step="5" value="50" />
      <span id="tileValue">50px</span>
    </div>

    <button id="resetButton">Reset Activity</button>
  </section>

  <main class="comparison">
    <section class="panel">
      <h2>Left</h2>
      <canvas id="pixelCanvas" width="520" height="520"></canvas>
    </section>

    <section class="panel">
      <h2>Right</h2>
      <canvas id="rearrangeCanvas" width="520" height="520"></canvas>
    </section>
  </main>

  <p class="note">
    Move your mouse over either canvas to choose the zoom center. Increase the zoom slider to see the difference
  </p>

  <script>
    const pixelCanvas = document.getElementById("pixelCanvas");
    const rearrangeCanvas = document.getElementById("rearrangeCanvas");

    const pixelCtx = pixelCanvas.getContext("2d");
    const rearrangeCtx = rearrangeCanvas.getContext("2d");

    const zoomRange = document.getElementById("zoomRange");
    const tileRange = document.getElementById("tileRange");
    const zoomValue = document.getElementById("zoomValue");
    const tileValue = document.getElementById("tileValue");
    const resetButton = document.getElementById("resetButton");

    const size = 520;

    let zoom = 1;
    let tileSize = 50;
    let focus = {
      x: size / 2,
      y: size / 2
    };

    const sourceCanvas = document.createElement("canvas");
    sourceCanvas.width = size;
    sourceCanvas.height = size;
    const sourceCtx = sourceCanvas.getContext("2d");

    function createSourceImage() {
      sourceCtx.clearRect(0, 0, size, size);

      const gradient = sourceCtx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, "#60a5fa");
      gradient.addColorStop(0.5, "#f472b6");
      gradient.addColorStop(1, "#facc15");

      sourceCtx.fillStyle = gradient;
      sourceCtx.fillRect(0, 0, size, size);

      sourceCtx.fillStyle = "rgba(255, 255, 255, 0.22)";
      for (let y = 0; y < size; y += 26) {
        sourceCtx.fillRect(0, y, size, 2);
      }

      for (let x = 0; x < size; x += 26) {
        sourceCtx.fillRect(x, 0, 2, size);
      }

      sourceCtx.fillStyle = "#111827";
      sourceCtx.beginPath();
      sourceCtx.arc(260, 260, 130, 0, Math.PI * 2);
      sourceCtx.fill();

      sourceCtx.fillStyle = "#f9fafb";
      sourceCtx.beginPath();
      sourceCtx.arc(210, 225, 28, 0, Math.PI * 2);
      sourceCtx.arc(310, 225, 28, 0, Math.PI * 2);
      sourceCtx.fill();

      sourceCtx.fillStyle = "#111827";
      sourceCtx.beginPath();
      sourceCtx.arc(220, 230, 10, 0, Math.PI * 2);
      sourceCtx.arc(300, 230, 10, 0, Math.PI * 2);
      sourceCtx.fill();

      sourceCtx.strokeStyle = "#f9fafb";
      sourceCtx.lineWidth = 14;
      sourceCtx.lineCap = "round";
      sourceCtx.beginPath();
      sourceCtx.arc(260, 275, 60, 0.15 * Math.PI, 0.85 * Math.PI);
      sourceCtx.stroke();

      sourceCtx.fillStyle = "#ffffff";
      sourceCtx.font = "bold 46px Arial";
      sourceCtx.textAlign = "center";
      sourceCtx.fillText("SHARP IMAGE", 260, 445);

      sourceCtx.fillStyle = "#111827";
      sourceCtx.font = "bold 24px Arial";
      sourceCtx.fillText("Canvas Activity", 260, 72);
    }

    function getZoomSourceRectangle() {
      const sourceWidth = size / zoom;
      const sourceHeight = size / zoom;

      let sx = focus.x - sourceWidth / 2;
      let sy = focus.y - sourceHeight / 2;

      sx = Math.max(0, Math.min(size - sourceWidth, sx));
      sy = Math.max(0, Math.min(size - sourceHeight, sy));

      return {
        sx,
        sy,
        sw: sourceWidth,
        sh: sourceHeight
      };
    }

    function drawPixelatedZoom() {
      pixelCtx.clearRect(0, 0, size, size);

      const rect = getZoomSourceRectangle();

      pixelCtx.imageSmoothingEnabled = zoom <= 1;

      pixelCtx.drawImage(
        sourceCanvas,
        rect.sx,
        rect.sy,
        rect.sw,
        rect.sh,
        0,
        0,
        size,
        size
      );

      drawCrosshair(pixelCtx);
    }

    function drawRearrangedZoom() {
      rearrangeCtx.clearRect(0, 0, size, size);

      const rect = getZoomSourceRectangle();

      rearrangeCtx.imageSmoothingEnabled = true;
      rearrangeCtx.imageSmoothingQuality = "high";

      if (zoom === 1) {
        rearrangeCtx.drawImage(sourceCanvas, 0, 0, size, size);
      } else {
        const cols = Math.ceil(size / tileSize);
        const rows = Math.ceil(size / tileSize);

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const dx = col * tileSize;
            const dy = row * tileSize;

            const dw = Math.min(tileSize, size - dx);
            const dh = Math.min(tileSize, size - dy);

            const baseSx = rect.sx + (dx / size) * rect.sw;
            const baseSy = rect.sy + (dy / size) * rect.sh;

            const sourceTileW = (dw / size) * rect.sw;
            const sourceTileH = (dh / size) * rect.sh;

            const waveX = Math.sin(row * 1.2 + zoom) * 22 * (zoom - 1);
            const waveY = Math.cos(col * 1.2 + zoom) * 22 * (zoom - 1);

            let shiftedSx = baseSx + waveX;
            let shiftedSy = baseSy + waveY;

            shiftedSx = wrapCoordinate(shiftedSx, 0, size - sourceTileW);
            shiftedSy = wrapCoordinate(shiftedSy, 0, size - sourceTileH);

            rearrangeCtx.drawImage(
              sourceCanvas,
              shiftedSx,
              shiftedSy,
              sourceTileW,
              sourceTileH,
              dx,
              dy,
              dw,
              dh
            );

            rearrangeCtx.strokeStyle = "rgba(255, 255, 255, 0.28)";
            rearrangeCtx.lineWidth = 1;
            rearrangeCtx.strokeRect(dx, dy, dw, dh);
          }
        }
      }

      drawCrosshair(rearrangeCtx);
    }

    function wrapCoordinate(value, min, max) {
      const range = max - min;

      if (range <= 0) {
        return min;
      }

      while (value < min) {
        value += range;
      }

      while (value > max) {
        value -= range;
      }

      return value;
    }

    function drawCrosshair(ctx) {
      ctx.save();

      ctx.strokeStyle = "rgba(17, 24, 39, 0.8)";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(focus.x - 15, focus.y);
      ctx.lineTo(focus.x + 15, focus.y);
      ctx.moveTo(focus.x, focus.y - 15);
      ctx.lineTo(focus.x, focus.y + 15);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(focus.x - 15, focus.y);
      ctx.lineTo(focus.x + 15, focus.y);
      ctx.moveTo(focus.x, focus.y - 15);
      ctx.lineTo(focus.x, focus.y + 15);
      ctx.stroke();

      ctx.restore();
    }

    function render() {
      zoom = Number(zoomRange.value);
      tileSize = Number(tileRange.value);

      zoomValue.textContent = zoom.toFixed(1) + "x";
      tileValue.textContent = tileSize + "px";

      drawPixelatedZoom();
      drawRearrangedZoom();
    }

    function updateFocusFromPointer(event) {
      const rect = event.currentTarget.getBoundingClientRect();

      const scaleX = size / rect.width;
      const scaleY = size / rect.height;

      focus.x = (event.clientX - rect.left) * scaleX;
      focus.y = (event.clientY - rect.top) * scaleY;

      focus.x = Math.max(0, Math.min(size, focus.x));
      focus.y = Math.max(0, Math.min(size, focus.y));

      render();
    }

    pixelCanvas.addEventListener("mousemove", updateFocusFromPointer);
    rearrangeCanvas.addEventListener("mousemove", updateFocusFromPointer);

    pixelCanvas.addEventListener("touchmove", function(event) {
      event.preventDefault();
      updateFocusFromPointer(event.touches[0]);
    }, { passive: false });

    rearrangeCanvas.addEventListener("touchmove", function(event) {
      event.preventDefault();
      updateFocusFromPointer(event.touches[0]);
    }, { passive: false });

    zoomRange.addEventListener("input", render);
    tileRange.addEventListener("input", render);

    resetButton.addEventListener("click", function() {
      zoomRange.value = 1;
      tileRange.value = 50;

      focus = {
        x: size / 2,
        y: size / 2
      };

      render();
    });

    createSourceImage();
    render();
  </script>
</body>
</html>
