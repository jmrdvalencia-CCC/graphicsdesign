<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphics Design Activities</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #111827; color: #f9fafb; min-height: 100vh; }
    header { text-align: center; padding: 48px 16px 24px; }
    header h1 { font-size: 36px; margin-bottom: 8px; }
    header p { color: #9ca3af; font-size: 16px; }
    .activities { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 32px 16px 48px; }
    .card {
      background: #1f2937; border: 1px solid #374151; border-radius: 16px;
      width: 200px; padding: 28px 20px; text-align: center; text-decoration: none;
      color: #f9fafb; transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-6px); border-color: #38bdf8; }
    .card .icon { font-size: 52px; margin-bottom: 16px; }
    .card h2 { font-size: 16px; line-height: 1.4; }
  </style>
</head>
<body>

<header>
  <h1>Graphics Design Activities</h1>
  <p>Select an activity to get started</p>
</header>

<div class="activities">
  <a class="card" href="zoom-acitivty.html">
    <div class="icon">🔍</div>
    <h2>Find the Difference</h2>
  </a>
</div>

</body>
</html>
